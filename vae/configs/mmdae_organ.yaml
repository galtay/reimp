# The tissue-supervised MMD autoencoder of Pande et al. 2026, closest to the
# paper: configs/mmdae_none.yaml plus a classifier head (121 -> 32 -> 26
# organs, BatchNorm, ReLU, dropout 0.1) on the sampled z, trained jointly by
# cross-entropy in an unweighted sum with MSE and MMD. The label is a fixed
# project -> organ map (reimp_vae.organs); normals get their organ.
# Supervised: report its gap to mmdae_none, never a rank among unsupervised
# models. The within-organ probes stay an honest test.
seed_everything: 0

trainer:
  max_epochs: 500
  accelerator: auto
  devices: 1
  log_every_n_steps: 20
  # Fold k runs in runs/mmdae_organ/fold<k>/, with checkpoints/best.ckpt and last.ckpt:
  #   vae-embed --ckpt runs/mmdae_organ/fold0/checkpoints/best.ckpt --out out/mmdae_organ/fold0.parquet
  default_root_dir: runs/mmdae_organ
  logger:
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: runs/mmdae_organ # replaced by the fold's directory
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
        save_top_k: 1
        filename: best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10

model:
  # n_genes and n_classes are linked from data.
  latent_dim: 121
  hidden_factor: 0.2 # or hidden_dim: <width>
  heads: linear
  reconstruction: mse
  regularizer: mmd
  mmd_prior_samples: 200
  logvar_max: 0.0 # posterior no wider than the prior; see README
  class_hidden: 32
  class_dropout: 0.1
  glorot_init: false
  xavier_init: true # Flexynesis's: encoder and decoder weights; default biases and head
  lr: 1.72e-3

data:
  quantification: tpm_unstranded
  gene_types: [protein_coding]
  transform: log1p
  top_genes: null
  scaling: zscore
  supervision: organ
  batch_size: 32
  num_workers: 0
  fold: 0 # cross-validation fold, 0-4: train one model per fold
