# The MMD autoencoder of Pande et al. 2026 without its classifier head: the
# unsupervised reference for the supervised variants. Log TPM over the
# 19,944 protein-coding genes, z-scored per gene on the fold's training
# samples; one hidden layer of 0.2 · n_genes (3,989) with LeakyReLU and
# BatchNorm; a 121-d latent; MSE with a linear output, plus MMD between the
# sampled z and N(0, I). Adam 1.72e-3, batch 32, at most 500 epochs with
# early stopping (patience 10) on the fold's val loss.
seed_everything: 0

trainer:
  max_epochs: 500
  accelerator: auto
  devices: 1
  log_every_n_steps: 20
  default_root_dir: runs/mmdae_none
  logger:
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: runs/mmdae_none
        name: ""
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
        save_top_k: 1
        filename: best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10

model:
  # n_genes and n_classes are linked from data.
  latent_dim: 121
  hidden_factor: 0.2 # or hidden_dim: <width>
  heads: linear
  reconstruction: mse
  regularizer: mmd
  mmd_prior_samples: 200
  logvar_max: 0.0 # posterior no wider than the prior; see README
  glorot_init: false
  lr: 1.72e-3

data:
  quantification: tpm_unstranded
  gene_types: [protein_coding]
  transform: log1p
  top_genes: null
  scaling: zscore
  supervision: none
  batch_size: 32
  num_workers: 0
  fold: 0 # cross-validation fold, 0-4: train one model per fold
