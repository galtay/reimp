# About a minute on real data: the MMD-AE with the organ head
# (configs/mmdae_organ.yaml) on fold 0 for two short epochs, full width.
# The unsupervised reference is one override away:
#   vae fit --config vae/configs/debug_mmdae.yaml --data.supervision none \
#     --trainer.default_root_dir runs/debug/mmdae_none
# Then:
#   vae-embed --ckpt runs/debug/mmdae_organ/fold0/checkpoints/best.ckpt \
#     --out out/vae_debug/mmdae_organ/fold0.parquet
seed_everything: 0

trainer:
  max_epochs: 2
  limit_train_batches: 40
  limit_val_batches: 10
  accelerator: auto
  devices: 1
  log_every_n_steps: 10
  default_root_dir: runs/debug/mmdae_organ
  logger: false
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 1
        filename: best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 10

model:
  # n_genes and n_classes are linked from data.
  latent_dim: 256
  hidden_factor: 0.2
  heads: linear
  reconstruction: mse
  regularizer: mmd
  mmd_prior_samples: 200
  logvar_max: 0.0 # posterior no wider than the prior; see README
  class_hidden: 32
  class_dropout: 0.1
  glorot_init: false
  xavier_init: true # Flexynesis's: encoder and decoder weights; default biases and head
  lr: 1.72e-3

data:
  quantification: tpm_unstranded
  gene_types: [protein_coding]
  transform: log1p
  top_genes: null
  scaling: zscore
  supervision: organ
  batch_size: 32
  fold: 0
