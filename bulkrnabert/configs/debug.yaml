# About a minute on real data (Apple M4 Max, MPS): a tiny BulkRNABert over a
# handful of batches, to check the pipeline end to end before a long run.
# Attention spans all ~20k gene tokens, so the model stays small: one head of
# dimension 32 (MPS's fast attention path; 16 is several times slower), two
# layers, two samples per batch. Embed with `--batch-size 4`; at 8 the
# attention scores pass the 2^31 elements MPS allows per tensor unless
# `model.attn_chunk` is set.
seed_everything: 0

trainer:
  max_epochs: 1
  limit_train_batches: 60
  limit_val_batches: 20
  accelerator: auto
  devices: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  default_root_dir: runs/bulkrnabert_debug
  logger: false
  # Just `<default_root_dir>/checkpoints/last.ckpt`, overwritten on a rerun,
  # for `bulkrnabert-embed`.
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true
        save_top_k: 0
        enable_version_counter: false

model:
  # n_genes is linked from data; the tokenizer maximum is fit on the fold's
  # training rows when fit starts.
  n_bins: 64
  d_model: 32
  n_layers: 2
  n_heads: 1
  dim_ff: 64
  mask_prob: 0.15
  lr: 1.0e-3

data:
  quantification: tpm_unstranded
  gene_types: [protein_coding]
  transform: log1p
  batch_size: 2
  fold: 0
