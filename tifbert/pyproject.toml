[project]
name = "reimp-tifbert"
version = "0.1.0"
description = "Reimplementation of TifBERT (Hosseini and Sharma, 2026) on TCGA bulk RNA-seq."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Gabriel Altay", email = "gabriel.altay@gmail.com" },
]
dependencies = [
    "reimp-shared",
    "lightning[pytorch-extra]",
    "numpy",
    "torch",
]

[project.scripts]
tifbert = "reimp_tifbert.cli:main"
tifbert-embed = "reimp_tifbert.embed:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
