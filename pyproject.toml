# uv workspace for reimplementations of RNA-seq representation learners.
#
#   shared/       reimp-shared       data access, patient-level splits, preprocessing,
#                                    linear probes, PCA baseline. Every model uses it.
#   txfm/         reimp-txfm         TxFM (Kenyon-Dean et al., ICLR 2026 FM4S workshop).
#   bulkrnabert/  reimp-bulkrnabert  BulkRNABert (Gélard et al., ML4H 2024).
#   tifbert/      reimp-tifbert      TifBERT (Hosseini and Sharma, 2026).
#   bulkformer/   reimp-bulkformer   BulkFormer (Kang et al., Cell Systems 2026).
#   tabssl/       reimp-tabssl       SCARF, VIME and BYOL on one MLP encoder
#                                    (Dradjat et al., 2025).
#   vae/          reimp-vae          Tybalt (Way and Greene, 2018) and a tissue-
#                                    supervised MMD autoencoder (Pande et al., 2026).
#   compass/      reimp-compass      COMPASS (Shen et al., 2026).
#
# A new reimplementation is a new directory with its own pyproject.toml,
# listed in `members` and `[tool.uv.sources]` below.

[tool.uv.workspace]
members = ["shared", "txfm", "bulkrnabert", "tifbert", "bulkformer", "tabssl", "vae", "compass"]

[tool.uv.sources]
reimp-shared = { workspace = true }
reimp-txfm = { workspace = true }
reimp-bulkrnabert = { workspace = true }
reimp-tifbert = { workspace = true }
reimp-bulkformer = { workspace = true }
reimp-tabssl = { workspace = true }
reimp-vae = { workspace = true }
reimp-compass = { workspace = true }

[dependency-groups]
dev = [
    "latex2mathml>=3.81.1",
    "pre-commit>=4.0",
    "pytest>=9.0.3",
    # Keep in lockstep with the rev pinned in .pre-commit-config.yaml.
    "ruff>=0.15.12",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
# importlib mode lets each package keep a plain tests/ directory without
# test-module basenames colliding across packages.
addopts = ["--import-mode=importlib", "-m", "not network"]
# The report build scripts import their shared module, reportkit, as a script would.
pythonpath = ["reports/build"]
markers = [
    "network: downloads from the HF Hub (run with '-m network')",
]
testpaths = ["shared/tests", "txfm/tests", "bulkrnabert/tests", "tifbert/tests", "bulkformer/tests", "tabssl/tests", "vae/tests", "compass/tests", "reports/build"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["reimp_shared", "reimp_txfm", "reimp_bulkrnabert", "reimp_tifbert", "reimp_bulkformer", "reimp_tabssl", "reimp_vae", "reimp_compass"]
