# PLIER on TCGA protein-coding genes with the paper's defaults where it gives
# them (lambda2 = d_k, lambda1 = d_k / 2, 70% of LVs with a gene set, a fifth
# of each set's genes held out, stopping at ||dB|| / ||B|| < 5e-6) and ours
# where it does not (plier/README.md lists them). k = 256, reimp's common
# embedding size, beside PCA-256. One model per fold (--data.fold 0-4); every
# statistic is fit on that fold's training samples.
#
# Variants, each to its own out_dir:
#   --model.k null                   the paper's rule: 2 x the components before
#                                    the elbow of the training singular values
#                                    (k = 492 on fold 0)
#   --prior null                     the no-prior ablation (U = 0), same k
#   --all_genes false                the prior's genes only
out_dir: runs/plier
# Gene sets as reimp_shared.genesets reads them: MSigDB collections by name,
# GMT files by path. MultiPLIER's canonical pathways and cell-type markers,
# as far as MSigDB's licences allow (plier/README.md, "Prior").
prior: [reactome, pid, wikipathways, kegg_medicus, cell_type]
all_genes: true

data:
  quantification: unstranded
  gene_types: [protein_coding]
  transform: lognorm
  library_size: 100000.0
  fold: 0 # cross-validation fold, 0-4: train one model per fold

model:
  k: 256 # null: k_factor x the principal components k_rule keeps
  k_rule: elbow # or gavish_donoho: the singular values above its noise threshold
  k_factor: 2.0
  l1: null # null: lambda2 / 2
  l2: null # null: d_k
  l3: null # null: set so that frac of the LVs use a gene set
  frac: 0.7
  l3_every: 10 # lambda3 is set again every 10 iterations with the prior
  holdout: 0.2 # share of each set's genes held out, for the annotations
  min_genes: 5 # smaller gene sets are left out of C
  max_iter: 300 # per phase: U = 0, then with the prior
  tol: 5.0e-06
  patience: 20
  seed: 0
