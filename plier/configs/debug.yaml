# About a minute on real data: fold 0's whole training set with the default
# prior, but a fixed k = 32 and at most 30 iterations per phase (U = 0, then
# with the prior), so the prior enters and lambda3 is set three times.
# Checks the pipeline end to end before a full run.
out_dir: runs/plier_debug
# Gene sets as reimp_shared.genesets reads them: MSigDB collections by name,
# GMT files by path (plier/README.md, "Prior").
prior: [reactome, pid, wikipathways, kegg_medicus, cell_type]
all_genes: true

data:
  quantification: unstranded
  gene_types: [protein_coding]
  transform: lognorm
  library_size: 100000.0
  fold: 0

model:
  k: 32
  max_iter: 30
  seed: 0
