[project]
name = "reimp-tabssl"
version = "0.1.0"
description = "Tabular self-supervised learning (SCARF, VIME, BYOL) on one MLP encoder, after Dradjat et al. (Bioinformatics 2025), on TCGA bulk RNA-seq."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Gabriel Altay", email = "gabriel.altay@gmail.com" },
]
dependencies = [
    "reimp-shared",
    "lightning[pytorch-extra]",
    "numpy",
    "torch",
]

[project.scripts]
tabssl = "reimp_tabssl.cli:main"
tabssl-embed = "reimp_tabssl.embed:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
