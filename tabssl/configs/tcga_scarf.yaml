# SCARF as Dradjat et al. run it (§2.2.1, Table S3) on TCGA protein-coding
# genes: 30% of each sample's genes replaced from Uniform[min, max] over the
# training samples, clean anchor vs. one corrupted view, NT-Xent at tau = 1.0,
# Adam 1e-4, batch 256, up to 1,000 epochs. Early stopping on val patients;
# embed from the best checkpoint, runs/tabssl_scarf/fold<k>/checkpoints/best.ckpt.
seed_everything: 0

trainer:
  max_epochs: 1000
  accelerator: auto
  devices: 1
  log_every_n_steps: 10
  default_root_dir: runs/tabssl_scarf
  logger:
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: runs/tabssl_scarf
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: runs/tabssl_scarf
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
        save_top_k: 1
        filename: best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 30 # the paper's patience (for its classifier heads)

model:
  # n_genes is linked from data.
  objective: scarf
  hidden_dim: 256
  n_layers: 4
  dropout: 0.2
  corruption_rate: 0.3
  scarf_replacement: uniform # or marginal: the original SCARF (paper Fig. S6)
  temperature: 1.0
  lr: null # null = the objective's rate in Table S3: Adam 1e-4

data:
  quantification: unstranded
  gene_types: [protein_coding]
  transform: lognorm
  library_size: 100000.0
  batch_size: 256
  num_workers: 0
  fold: 0 # cross-validation fold, 0-4: train one model per fold
