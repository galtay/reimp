[project]
name = "reimp-compass"
version = "0.1.0"
description = "Reimplementation of COMPASS's concept-bottleneck pretraining (Shen et al., Nature Medicine 2026) on TCGA bulk RNA-seq."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Gabriel Altay", email = "gabriel.altay@gmail.com" },
]
dependencies = [
    "reimp-shared",
    "lightning[pytorch-extra]",
    "numpy",
    "pandas",
    "torch",
]

[project.scripts]
compass = "reimp_compass.cli:main"
compass-embed = "reimp_compass.embed:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
