[project]
name = "reimp-shared"
version = "0.1.0"
description = "Data access, patient-level splits, configurable data loaders and linear probes shared by the reimp models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Gabriel Altay", email = "gabriel.altay@gmail.com" },
]
dependencies = [
    "huggingface-hub",
    "lightning",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "torch",
]

[project.scripts]
reimp-shared = "reimp_shared.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
