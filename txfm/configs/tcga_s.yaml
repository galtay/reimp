# TxFM-S (paper Table 6: 6 blocks, 6 heads, 384-d, stochastic depth 0.1) on
# TCGA protein-coding genes. K = 2048 of 19,944 genes masks ~90% of each
# sample, the paper's average ratio on DiverseRNA-1.4M.
seed_everything: 0

trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  default_root_dir: runs/txfm_s
  logger:
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: runs/txfm_s
        name: ""
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: runs/txfm_s
        name: ""
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
        save_top_k: 1
        filename: best
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step

model:
  # n_genes and library_size are linked from data.
  n_unmasked: 2048
  d_model: 384
  n_layers: 6
  n_heads: 6
  mlp_ratio: 4.0
  decoder_layers: 4
  dropout: 0.0
  drop_path_rate: 0.1
  layer_scale_init: 1.0e-4
  activation: tanh
  lr: 1.0e-3
  weight_decay: null # null = 1 / (lr * total steps), the paper's rule
  warmup_frac: 0.1

data:
  quantification: unstranded
  gene_types: [protein_coding]
  transform: lognorm
  library_size: 100000.0
  batch_size: 64
  num_workers: 0
  fold: 0 # cross-validation fold, 0-4: train one model per fold
