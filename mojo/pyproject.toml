[project]
name = "reimp-mojo"
version = "0.1.0"
description = "Reimplementation of MOJO's RNA half (Gélard et al., 2025): BulkRNABert's tokens on a convolutional U-Net, on TCGA bulk RNA-seq."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Gabriel Altay", email = "gabriel.altay@gmail.com" },
]
dependencies = [
    "reimp-shared",
    "lightning[pytorch-extra]",
    "numpy",
    "pandas",
    "torch",
]

[project.scripts]
mojo = "reimp_mojo.cli:main"
mojo-embed = "reimp_mojo.embed:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
