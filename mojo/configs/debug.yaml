# About a minute on real data: a tiny MOJO over a handful of batches, to
# check the pipeline end to end before committing to a long run. Keeps the
# 8 halving blocks (19,944 genes -> 78 pooled positions) at toy widths, and
# saves <default_root_dir>/checkpoints/last.ckpt for mojo-embed.
seed_everything: 0

trainer:
  max_epochs: 1
  limit_train_batches: 40
  limit_val_batches: 5
  accelerator: auto
  devices: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 5
  default_root_dir: runs/mojo_debug
  logger: false
  callbacks:
    # No dirpath: with no logger, checkpoints go under default_root_dir.
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true
        save_top_k: 0
        enable_version_counter: false

model:
  # n_genes is linked from data; token_max is fit on the fold's training rows.
  embed_dim: 32
  conv_channels: 32
  d_model: 64
  n_down: 8
  n_layers: 2
  n_heads: 4
  lr: 1.0e-3

data:
  quantification: tpm_unstranded
  gene_types: [protein_coding]
  transform: log1p
  batch_size: 16
  fold: 0
